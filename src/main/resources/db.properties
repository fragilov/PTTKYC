# ========================================================
# CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU (Database Configuration)
# Hệ thống hỗ trợ 2 chế độ:
#  - 'sqlite': Mặc định, chạy cục bộ độc lập với file ql_banlinhkien.db,
#              tự động sinh bảng và dữ liệu mẫu nếu chưa có.
#  - 'sqlserver': Microsoft SQL Server theo đúng thiết kế tài liệu Section 2.6 và QL_BanLinhKien.sql
# ========================================================

# Loại CSDL đang sử dụng (sqlite hoặc sqlserver)
db.type=sqlite

# --- Cấu hình SQLite (File-based DB cho demo và phát triển) ---
sqlite.url=jdbc:sqlite:ql_banlinhkien.db

# --- Cấu hình Microsoft SQL Server (Theo QL_BanLinhKien.sql) ---
sqlserver.host=localhost
sqlserver.port=1433
sqlserver.databaseName=QL_BanLinhKien
sqlserver.username=sa
sqlserver.password=123456
sqlserver.encrypt=false
sqlserver.trustServerCertificate=true

# Tùy chọn tự động khởi tạo dữ liệu mẫu nếu bảng trống (true/false)
db.init.sample_data=true
